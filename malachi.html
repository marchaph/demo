<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
    <a-scene>
   
    <a-camera>
         <a-cursor fuse="true" fuse-timeout="100"></a-cursor>
     </a-camera>
     
<a-sky color="skyblue"></a-sky>
<a-plane rotation="-90 0 0" width="25" height="25" color="darkgreen"></a-plane>
    <a-sphere id="sphere" radius="1" position="-4 1 -5" color="lightblue"
        animation__scale="
            property: scale;
            from: 1 1 1;
            to: 0 0 0;
            dir: alternate;
            startEvent: click;
        "></a-sphere>
    </a-scene>
    <script>
    const scene = document.querySelector('a-scene');
    const sphere = document.querySelector('#sphere');
    const rand = (min, max) => min + Math.random() * (max - min);

    function moveToRandom() {
    sphere.setAttribute('animation__position', {
    property: 'position', to: `${rand(-4, 4)} ${rand(0.5, 3)} ${rand(-8, -2)}`,
    dur: 1000, easing: 'easeInOutQuad'
    }); }

    sphere.addEventListener('animationcomplete', (e) => {
    // Only react when the position animation finishes
    if (e.detail.name === 'animation__position') moveToRandom();
  });    
    
    if (scene.hasLoaded)
    {
    moveToRandom();
    }
    else
    {
    scene.addEventListener('loaded', moveToRandom);
    }
    </script>
   
    </body>
    </html>
