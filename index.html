<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>A-Frame Test</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <style>
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            color: black;
            padding: 15px;
            font-family: Arial;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div id="status">
    HTML is working
</div>

<a-scene background="color: red">

    <a-box
        position="0 0 -3"
        color="blue">
    </a-box>

</a-scene>

<script>
    console.log("JavaScript is working");

    window.addEventListener("load", function () {
        document.getElementById("status").innerHTML =
            "HTML + JavaScript are working";
    });

    document.addEventListener("DOMContentLoaded", function () {
        console.log("DOM loaded");
    });
</script>

</body>
</html>
