<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Raw WebGL Test</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            color: black;
            padding: 15px;
            font-family: Arial;
            font-size: 20px;
        }

        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="status">Starting...</div>

<script>

console.log("1. JavaScript started");

const canvas = document.createElement("canvas");

document.body.appendChild(canvas);

console.log("2. Canvas created");

const gl = canvas.getContext("webgl2");

if (!gl) {

    document.getElementById("status").innerHTML =
        "WebGL2 FAILED";

    console.log("3. WebGL2 FAILED");

} else {

    console.log("3. WebGL2 context created");

    document.getElementById("status").innerHTML =
        "WebGL2 context created";

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );

    gl.clearColor(
        1.0,
        0.0,
        0.0,
        1.0
    );

    gl.clear(gl.COLOR_BUFFER_BIT);

    console.log("4. Canvas cleared red");
}

</script>

</body>
</html>
