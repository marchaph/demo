<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene>
                       <a-sphere position="5 0 -5" radius="1" color="red"
                        animation="
                        property: scale;
                         from: 1 1 1;
                        to: 0.1 0.1 0.1;
                         loop: true;
                         dir: alternate;
                         "></a-sphere>
     
                         <a-box position="5 0 -10" depth="2" height="4" width="0.5" color="tomato"
                         animation="
                         property: position;
                         from: 5 0 -10;
                         to: 5 20 -10;
                         dur: 5000;
                         dir: alternate;
                         loop: true;
                         "></a-box>
     
                        <a-torus color="#43A367" arc="360" radius="1" radius-tubular="0.1" position="5 0 -15"
                         animation="
                         property: rotation;
                         from: 10;
                         to: 360;
                         dir: alternate;
                         dur: 2000;
                         loop: true;
                         "></a-torus>
     
                       <a-sphere position="5 0 0" radius="1" color="teal"
                       animation="
                       property: color;
                       from: rgb(255,0, 0);
                       to: rgb(0,255,255);
                       dur: 5000;
                       dir: alternate;
                       loop: true;
                       "></a-sphere>
     
                           <a-box position="5 0 5" depth="2" height="4" width="0.5" color="#ffc800"
                           animation="
                           property: opacity;
                           from: 1;
                           to: 0.1;
                           dur: 2500;
                            dir: alternate;
                            loop: true;
                           "></a-box>
     
                           <a-cone color="#566ab8" radius-bottom="2" radius-top="0.5" height="1" position="5 0 10"
                           animation="
                           property: visible;
                           from: true;
                           to: false;
                           dur: 5000;
                           dir: alternate;
                           loop: true;
                           "></a-cone>
     
                         <a-icosahedron radius="0.6"
                       color="#FFC107"
                       material="roughness: 0.3; metalness: 0.2"
                       position="5 0 12"
                       animation="
                       property: scale;
                        from: 1 1 1;
                        to: 0.1 0.1 0.1;
                         loop: true;
                         dir: alternate;
                       "></a-icosahedron>
                         
                       
     
        </a-scene>
    </body>
</html>
