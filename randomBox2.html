<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box id="box" position="0 1 -5" color="tomato"></a-box>
      <a-plane rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>

    <script>
      const scene = document.querySelector('a-scene');
      const box = document.querySelector('#box');
      const rand = (min, max) => min + Math.random() * (max - min);

      function moveToRandom() {
        box.setAttribute('animation', {
          property: 'position',
          to: `${rand(-4, 4)} ${rand(0.5, 3)} ${rand(-8, -2)}`,
          dur: 2000,
          easing: 'easeInOutQuad'
        });
      }

      // Start the next move whenever the current one finishes
      box.addEventListener('animationcomplete', moveToRandom);

      // Start the first move once the scene is ready
      if (scene.hasLoaded) {
        moveToRandom();
      } else {
        scene.addEventListener('loaded', moveToRandom);
      }
    </script>
  </body>
</html>
