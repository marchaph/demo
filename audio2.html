<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <audio id="bgm" src="background.mp3" preload="auto"></audio>
        <audio id="click-sfx" src="sound1.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Background music: attached to the scene, loops -->
      <a-entity id="music"
                sound="src: #bgm; loop: true; volume: 0.4;"></a-entity>

      <!-- Sound effect: attached to an object, plays on click -->
      <a-box id="box" position="0 1.5 -3" color="tomato"
             sound="src: #click-sfx; on: click; volume: 1"></a-box>

      <!--
      <a-entity cursor="rayOrigin: mouse"></a-entity> -->
      <a-camera>
          <a-cursor></a-cursor>
      </a-camera>
      <a-sky color="#aaa"></a-sky>
    </a-scene>
    <script>
  document.addEventListener('DOMContentLoaded', () => {
    const scene = document.querySelector('a-scene');
    const music = document.querySelector('#music');

    const startMusic = () => {
      music.components.sound.playSound();
    };

    // Fires once on the first user interaction
    scene.addEventListener('mousemove', startMusic, { once: true });
    window.addEventListener('touchstart', startMusic, { once: true });
  });
</script>
  </body>
</html>
