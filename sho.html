<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
       



        <a-scene>
            <a-assets>
                <audio id="bgm" src="background.mp3; preload=auto;"></audio>
      <audio id="soundEffect1" src="sound1.mpg3; preload=auto;"></audio>
 </a-assets>
<a-entity id="music sound="src: #bgm; loop: true; volume 0.4;"></a-entity>
           
            <a-camera>
               <a-cursor></a-cursor>
            </a-camera>
        <a-sphere
            sound="src: #soundEffect1; on: click; volume: 1;"
            position="0 1 -5"
            radius="1"
            height="1"
            animation="
                property: position;
                from: -1 1 -4;
                to: 2 0 -4;
                dur: 2000;
                easing: linear;
                loop: true;
                dir: alternate;
            "
            color="yellow">
        </a-sphere>
        </a-scene>
       
        <script>
      document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const music = document.querySelector('#music');

      const startMusic = () => {
      music.components.sound.playSound();
    };

    // Fires once on the first user interaction
    scene.addEventListener('mousemove', startMusic, { once: true });
    window.addEventListener('touchstart', startMusic, { once: true });
  });
</script>


    </body>
</html>
