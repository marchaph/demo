
<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
    </head>
        <body>
        <a-scene>
            <!-- Background & Floor Environment -->
            <a-sky color="#9f4f2a"></a-sky>
            <a-plane position="0 0 -5" rotation="-90 0 0" width="30" height="30" color="#111122"></a-plane>

            <!-- Sphere  Animations: Position & Color -->
            <a-sphere 
                position="0 2 -5" 
                radius="1" 
                color="#695bd2"
                animation="property: position; 
                from: 0 1.8 -5; 
                to: 0 3.2 -5; 
                dir: alternate; 
                loop: true; 
                dur: 2000;"
                
                animation__2="property: color; from: #ff0055; to: #00e5ff; dir: alternate; loop: true; dur: 3000">
            </a-sphere>

            <!--  Torus Animations: Rotation & Scale -->
            <a-torus 
                position="0 2.5 -5" 
                radius="1.8" 
                radius-tubular="0.05" 
                color="#71d1a7"
                animation="property: rotation; 
                to: 360 360 0; 
                loop: true; 
                dur: 4000; 
                easing: linear;"
                animation__2="property: scale; 
                from: 1 1 1; 
                to: 1.4 1.4 1.4; 
                dir: alternate; 
                loop: true; 
                dur: 2000">
            </a-torus>

            <!--  Box Animations: Rotation & Opacity -->
            <a-box 
                position="-4 2 -6" 
                width="1.2" height="1.2" depth="1.2" 
                color="#9b59b6" 
                material="transparent: true"
                animation="property: rotation; 
                to: 0 360 360; 
                loop: true; 
                dur: 5000; 
                easing: linear;"
                animation__2="property: material.opacity;
                from: 1; to: 0.1;
                dir: alternate;
                loop: true;
                dur: 1500">
            </a-box>

            <!--  Cone Animation: Visible -->
            <a-cone 
                position="4 2.5 -6" 
                radius-bottom="0.8" height="1.5" 
                color="#e74c3c"
                animation="property: visible; 
                from: true; 
                to: false; 
                dir: alternate; 
                loop: true; 
                dur: 1000">
            </a-cone>

            <!-- Cylinder Animation: Position -->
            <a-cylinder 
                position="-2.5 0.5 -3" 
                radius="0.4" height="1.5" 
                color="#2ecc71"
                animation="property: position; 
                from: -2.5 0.5 -3; 
                to: -2.5 2.5 -3; 
                dir: alternate; 
                loop: true; 
                dur: 2200; 
                easing: easeInOutQuad;">
            </a-cylinder>

            <!--  Dodecahedron Animation: Scale -->
            <a-dodecahedron 
                position="2.5 1.5 -3" 
                radius="0.7" 
                color="#3498db"
                animation="property: 
                scale; from: 0.7 0.7 0.7;
                to: 1.6 1.6 1.6; 
                dir: alternate; 
                loop: true; 
                dur: 1500;
                easing: easeInOutBounce;">
            </a-dodecahedron>

            <!-- Octahedron Animation: Rotation -->
            <a-octahedron 
                position="0 5 -5" 
                radius="0.8" 
                color="#f1c40f"
                animation="property: rotation; 
                to: 0 360 0; 
                loop: true; 
                dur: 2500; 
                easing: linear;">
            </a-octahedron>

            <!-- Camera Viewpoint -->
            <a-camera position="0 1.6 0"></a-camera>
        </a-scene>
    </body>
</html>
