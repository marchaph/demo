<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene> <!-- xr-mode-ui="XRMode: xr"> -->
            <a-sky color="#f71a5b"></a-sky>
            <a-sphere color="red" radius="1" position="0 1 -5"
                animation="
                    property: scale;
                    from: 1 1 1;
                    to: 2 2 2;
                    dir: alternate;
                    loop: true;
                    dur: 5000;"

                animation__2="
                    property: position;
                    from: 0 1 -5;
                    to: 0 4 -5;"
                ></a-sphere> 
        </a-scene>
    </body>
</html>
