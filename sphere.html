<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene> <!-- xr-mode-ui="XRMode: xr"> -->
            <a-sky color="#f71a5b"></a-sky>
            <a-plane position="0 0 -5" rotation="-90 0 0" width="30" height="30" color="#111122"></a-plane>

            <!-- Sphere  Animations: Position & Color -->
            <a-sphere 
                position="0 2 -5" 
                radius="1" 
                color="#695bd2"
                animation="property: position; 
                from: 0 1.8 -5; 
                to: 0 3.2 -5; 
                dir: alternate; 
                loop: true; 
                dur: 2000;"
                
                animation__2="property: color; from: #ff0055; to: #00e5ff; dir: alternate; loop: true; dur: 3000;">
            </a-sphere>


        </a-scene>
    </body>
</html>
