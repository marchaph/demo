<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
<a-scene>

<a-camera>
   
    <a-cursor fuse="true" fuse-timeout="100" color="orange"></a-cursor>
   
</a-camera>

<a-sky color="#ECECEC"></a-sky>
<a-plane rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>



<a-sphere id="box" radius=".5" position="0 1 -5" color="#000055"

    animation="
   
    property: scale;
    from: 1 1 1;
    to: 10 10 10;
    dur: 200;
    startEvents: click;
   
    "
   
    ></a-sphere>



<a-sphere id="ox" radius=".5" position="-2 1 -5" color="#00FF55"></a-sphere>





</a-scene>
<script>
const scene = document.querySelector('a-scene');
const box = document.querySelector('#box');
const ox = document.querySelector('#ox');
const rand = (min, max) => min + Math.random() * (max - min);

function moveToRandom() {
box.setAttribute('animation', {
property: 'position', to: `${rand(-4, 4)} ${rand(0.5, 3)} ${rand(-8, -2)}`,
dur: 1000, easing: 'easeInOutQuad'
});
   
ox.setAttribute('animation', {
property: 'position', to: `${rand(-4, 4)} ${rand(0.5, 3)} ${rand(-8, -2)}`,
dur: 1000, easing: 'easeInOutQuad'
});
}

// Start the next move whenever the current one finishes
box.addEventListener('animationcomplete', moveToRandom);
ox.addEventListener('animationcomplete', moveToRandom);
// Start the first move once the scene is ready
if (scene.hasLoaded)
{
moveToRandom();
}
else
{
scene.addEventListener('loaded', moveToRandom);
}
</script>



</body>
</html>
